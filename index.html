<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="نظام إدارة المطاعم والكاشير والمخزون MATO POS مع دعم العمل الكامل دون اتصال بالإنترنت" />
    <script>
      // Ensure trailing slash for GitHub Pages relative asset paths (e.g. /mato -> /mato/)
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>MATO POS - نظام إدارة المطاعم والعمل دون إنترنت</title>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

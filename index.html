    <script>
      // Fix GitHub Pages missing trailing slash (e.g., /mato -> /mato/)
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <link rel="manifest" href="manifest.json" />
    <title>MATO POS - نظام إدارة المطاعم والعمل دون إنترنت</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="نظام إدارة المطاعم والكاشير والمخزون MATO POS مع دعم العمل الكامل دون اتصال بالإنترنت" />
    <script>
      // 1. Instant trailing slash redirect for GitHub Pages relative assets (e.g. /mato -> /mato/)
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Unregister legacy service workers that intercept asset fetches on shared domains
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function(){});
      }

      // 3. Global resource & script error listener (useCapture: true to catch script load failures)
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var targetUrl = e.target && (e.target.src || e.target.href) ? (e.target.src || e.target.href) : '';
          var isTsxError = targetUrl.indexOf('.tsx') !== -1 || (e.message && e.message.indexOf('.tsx') !== -1);
          renderErrorScreen(e.message || (targetUrl ? 'فشل تحميل الملف: ' + targetUrl : 'خطأ في تحميل النظام'), isTsxError);
        }
      }, true);

      // 4. Watchdog timer: if React does not render within 6s, display emergency recovery UI
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          renderErrorScreen('تأخر استجابة ملفات التشغيل بسبب ملفات مؤقتة أو عدم تجميع المشروع (Build).', false);
        }
      }, 6000);

      function renderErrorScreen(msg, isTsx) {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        
        var detailsHtml = isTsx ? 
          '<div style="text-align:right;background:#0f172a;padding:14px;border-radius:10px;color:#cbd5e1;font-size:13px;line-height:1.7;margin-bottom:20px;border:1px solid #334155;">' +
            '<strong style="color:#fbbf24;display:block;margin-bottom:6px;">⚠️ سبب المشكلة على GitHub Pages:</strong>' +
            'تظهر هذه الشاشة لأن متصفحات الإنترنت لا يمكنها تشغيل أكواد TypeScript الخام (<code>.tsx</code>) مباشرة من المجلد الرئيسي. يجب تجميع المشروع إلى ملفات JavaScript جاهزة.<br/><br/>' +
            '<strong style="color:#38bdf8;display:block;margin-bottom:4px;">💡 الحل البسيط (تم إعداده لك تلقائياً):</strong>' +
            '1. في إعدادات <strong>GitHub Pages</strong> في مستودعك، قم بتغيير المصدر (Source) إلى <strong>GitHub Actions</strong>.<br/>' +
            '2. أو قم بتشغيل الأمر <code>npm run build</code> ونشر محتوى مجلد <code>dist</code> المجمع.<br/>' +
          '</div>' :
          '<div style="background:#0f172a;padding:12px;border-radius:10px;font-family:monospace;font-size:12px;color:#fca5a5;margin-bottom:20px;word-break:break-all;text-align:left;direction:ltr;border:1px solid #1e293b;">' + (msg || 'Resource load issue') + '</div>';

        root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#fff;direction:rtl;padding:24px;font-family:system-ui,-apple-system,sans-serif;">' +
          '<div style="background:#1e293b;padding:32px;border-radius:20px;max-width:560px;width:100%;border:1px solid #334155;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
          '<div style="width:56px;height:56px;background:#f59e0b20;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#f59e0b;font-size:28px;">⚡</div>' +
          '<h2 style="color:#fbbf24;margin-bottom:12px;font-size:22px;font-weight:bold;">MATO POS - تعليمات التشغيل على GitHub Pages</h2>' +
          '<p style="color:#cbd5e1;font-size:14px;line-height:1.6;margin-bottom:16px;">يرجى تجميع المشروع أو اختيار GitHub Actions لتنفيذ التجميع التلقائي:</p>' +
          detailsHtml +
          '<button onclick="localStorage.clear();sessionStorage.clear();if(\'serviceWorker\'in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));}window.location.reload(true);" style="background:#f59e0b;color:#0f172a;border:none;padding:14px 28px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:15px;width:100%;box-shadow:0 4px 12px rgba(245,158,11,0.3);transition:all 0.2s;">تنظيف التخزين وإعادة المحاولة 🔄</button>' +
          '</div></div>';
      }
    </script>
    <title>MATO POS - نظام إدارة المطاعم والعمل دون إنترنت</title>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

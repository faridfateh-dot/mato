<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="نظام إدارة المطاعم والكاشير والمخزون MATO POS مع دعم العمل الكامل دون اتصال بالإنترنت" />
    <script>
      // 1. Ensure trailing slash for GitHub Pages relative asset paths (e.g. /mato -> /mato/)
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Global error listener to catch script loading/syntax errors and prevent white screens
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#fff;direction:rtl;padding:24px;font-family:sans-serif;">' +
            '<div style="background:#1e293b;padding:32px;border-radius:16px;max-width:500px;border:1px solid #334155;text-align:center;">' +
            '<h2 style="color:#fbbf24;margin-bottom:12px;font-size:20px;font-weight:bold;">MATO POS - حماية النظام</h2>' +
            '<p style="color:#cbd5e1;font-size:14px;margin-bottom:16px;">حدث تعارض في الذاكرة المؤقتة القديمة. اضغط الزر لتحديث التطبيق وتنظيف التخزين:</p>' +
            '<div style="background:#0f172a;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;color:#fca5a5;margin-bottom:20px;word-break:break-all;text-align:left;direction:ltr;">' + (e.message || e.error || 'Script loading error') + '</div>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();if(\'serviceWorker\'in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));}window.location.reload(true);" style="background:#f59e0b;color:#0f172a;border:none;padding:12px 24px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px;">إعادة تنظيف التخزين وتحديث الصفحة</button>' +
            '</div></div>';
        }
      });
    </script>
    <title>MATO POS - نظام إدارة المطاعم والعمل دون إنترنت</title>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

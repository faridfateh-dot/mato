<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATO POS</title>
    <script>
      // Redirect GitHub Pages 404 to main index.html with route path restored
      var path = window.location.pathname;
      var repo = '/mato';
      if (path.startsWith(repo)) {
        window.location.replace(repo + '/#' + path.substring(repo.length));
      } else {
        window.location.replace('/mato/');
      }
    </script>
  </head>
  <body>
  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATO POS</title>
    <script>
      // Single Page Apps for GitHub Pages Hash Routing
      var pathSegments = window.location.pathname.split('/');
      // If repo name is second segment (e.g. /mato/page), redirect to /mato/#/page
      var repoPath = pathSegments.length > 1 ? '/' + pathSegments[1] + '/' : '/';
      var extraPath = pathSegments.slice(2).join('/');
      window.location.replace(repoPath + '#/' + extraPath + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
  </body>
</html>
